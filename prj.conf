# Bật bộ điều khiển GPIO và Bus
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SPI=y

# Hạ tầng RTOS cho giao tiếp liên luồng (IPC)
CONFIG_RING_BUFFER=y
CONFIG_POLL=y

# Cấp phát bộ nhớ Stack & Debugging
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_THREAD_STACK_INFO=y

# Kích hoạt module FSMC STM32 HAL/LL thông qua Application Kconfig
CONFIG_APP_ENABLE_STM32_HAL_FSMC=y

# Hỗ trợ khởi động lại và định dạng số thực
CONFIG_REBOOT=y
CONFIG_CBPRINTF_FP_SUPPORT=y


# Cấu hình Flash Map lưu trữ cấu hình kênh (Rolling Slot trực tiếp trên Sector 11)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y


#config ADC
CONFIG_ADC=y


# Bật hệ thống Logging của Zephyr
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# Chuyển toàn bộ Console và Log sang giao tiếp SEGGER RTT qua cổng nạp
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_LOG_BACKEND_RTT=y

# Tắt Console UART để không tranh chấp với driver khác
CONFIG_UART_CONSOLE=n
